name: Quest3-Pyrowave
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      cpu_only:
        description: 'Run CPU checks only for Python orchestration changes; reuse qualified native tools'
        type: boolean
        default: false
permissions:
  contents: read
env:
  XRWIRED_INPUTS: ${{ github.workspace }}/ws
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate authoritative source lock
        run: python3 tools/ci/source_lock.py --github-env >> "$GITHUB_ENV"
      - name: Reproducible-build contract checks
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/quest3/requirements-cpu.txt pytest==9.1.1
          python3 -m pytest tools/tests/test_ci_pins.py tools/tests/test_build_metadata.py tools/tests/test_unattended.py tools/tests/test_unattended_duration.py tools/tests/test_unattended_concurrency.py tools/tests/test_unattended_monitor.py tools/tests/test_unattended_restore.py tools/tests/test_unattended_preflight.py -q
      - name: Install CPU chart-test dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/quest3/requirements-cpu.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Geometry-control contract tests
        run: python3 -m unittest tools.tests.test_resolution -v
      - run: python3 -m unittest tools.tests.test_xrbench_framebank tools.tests.test_xrbench_hvs_scorer tools.tests.test_xrbench_nvenc_framebank -v
      - run: python3 -m unittest tools.tests.test_supervised -v
      - run: python3 -m unittest tools.tests.test_dualstream_h264_design -v
      - run: g++ -std=c++17 -Wall -Werror tools/pyroclient/decode_path_test.cpp -o /tmp/decode-path && /tmp/decode-path
      - run: g++ -std=c++17 -Wall -Wextra -Werror tools/pyroclient/pass_profile_test.cpp -o /tmp/pass-profile && /tmp/pass-profile
      - name: GPU failure-policy state-machine test
        run: g++ -std=c++17 -Wall -Wextra -Werror tools/pyroclient/gpu_failure_policy_test.cpp -o /tmp/gpu-failure-policy && /tmp/gpu-failure-policy
      - name: Software GLES readback correctness (no Quest hardware)
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/pyroclient/gpu_readback_gles.cpp tools/pyroclient/gpu_readback_test.cpp -lEGL -lGLESv2 -o /tmp/readback-test
          /tmp/readback-test
  client:
    runs-on: ubuntu-24.04
    needs: tests
    if: ${{ !inputs.cpu_only && always() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - name: Load authoritative build pins
        run: python3 tools/ci/source_lock.py --github-env >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconstruct pinned source trees
        run: sh tools/ci/fetch_sources.sh "$XRWIRED_INPUTS/research"
      - name: Stamp the installable client/server identity
        run: python3 tools/ci/stamp_alvr_version.py "$XRWIRED_INPUTS/research/ALVR-20.13.0"
      - name: Cache Rust dependencies and compiled Android targets
        id: cargo_client_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
            ws/research/ALVR-20.13.0/target/aarch64-linux-android/release
          key: q3pw-client-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            q3pw-client-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ env.NDK_VERSION }}-
      - name: Android toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "XRWIRED_ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "XRWIRED_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android
      - name: Compositor filter policy checks (no OpenXR runtime)
        run: |
          rustup run "$RUST_TOOLCHAIN" rustc --edition=2021 --test "$XRWIRED_INPUTS/research/ALVR-20.13.0/alvr/client_openxr/src/layer_filter.rs" -o /tmp/layer-filter-policy
          /tmp/layer-filter-policy
      - name: Restore pinned Android build tools
        id: android_tools_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cbindgen
            ~/.cargo/bin/cargo-apk
          key: q3pw-android-tools-v1-ubuntu24-${{ env.RUST_TOOLCHAIN }}-ndk4.1.2-cbindgen0.29.4-apk${{ env.CARGO_APK_COMMIT }}
      - name: Install pinned Android build tools on cache miss
        if: steps.android_tools_cache.outputs.cache-hit != 'true'
        run: |
          cargo +"$RUST_TOOLCHAIN" install --locked cargo-ndk@4.1.2 cbindgen@0.29.4
          cargo +"$RUST_TOOLCHAIN" install --locked --git https://github.com/zarik5/cargo-apk --rev "$CARGO_APK_COMMIT" cargo-apk
      - name: Verify cached tool executables
        run: |
          test -x "$HOME/.cargo/bin/cargo-ndk"
          test -x "$HOME/.cargo/bin/cbindgen"
          test -x "$HOME/.cargo/bin/cargo-apk"
      - name: Save pinned Android tools before application compilation
        if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.android_tools_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cbindgen
            ~/.cargo/bin/cargo-apk
          key: ${{ steps.android_tools_cache.outputs.cache-primary-key }}
      - name: Khronos loader used by upstream ALVR on Quest 3
        run: |
          dest="$XRWIRED_INPUTS/research/ALVR-20.13.0/deps/android_openxr/arm64-v8a"
          mkdir -p "$dest" /tmp/openxr
          curl -fsSL -o /tmp/openxr/loader.aar "https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/$OPENXR_LOADER_RELEASE/$OPENXR_LOADER_AAR"
          echo "$OPENXR_LOADER_SHA256  /tmp/openxr/loader.aar" | sha256sum --check --status
          unzip -q /tmp/openxr/loader.aar -d /tmp/openxr
          cp /tmp/openxr/prefab/modules/openxr_loader/libs/android.arm64-v8a/libopenxr_loader.so "$dest/"
      - name: Configure stable or temporary APK signing
        env:
          SIGNING_KEY: ${{ secrets.QUEST3_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.QUEST3_SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            test -n "$SIGNING_KEY" && test -n "$SIGNING_PASSWORD" || { echo "stable builds require QUEST3_SIGNING_KEYSTORE_BASE64 and QUEST3_SIGNING_KEYSTORE_PASSWORD" >&2; exit 1; }
            mkdir -p "$RUNNER_TEMP/quest3-signing"
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/quest3-signing/release.p12"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/quest3-signing/release.p12" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "Q3PW_SIGNING_KIND=stable" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/q3pw-development.p12" -storepass development -keypass development -alias q3pw-development -dname "CN=Quest3-Pyrowave CI development" -validity 2 -keyalg RSA -keysize 2048
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/q3pw-development.p12" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=development" >> "$GITHUB_ENV"
            echo "Q3PW_SIGNING_KIND=development" >> "$GITHUB_ENV"
          fi
      - name: Native libraries, probes and APK
        run: |
          sh tools/build_pyrowave_android.sh
          bash tools/pyrowave_android/build.sh
          bash tools/udptest/build.sh
          sh tools/build_alvr_2013.sh
      - name: Package development build
        run: |
          mkdir out
          python3 tools/ci/package_licenses.py "$XRWIRED_INPUTS/research" /tmp/quest3-notices/LICENSES
          (cd /tmp/quest3-notices && zip -qr "$GITHUB_WORKSPACE/out/LICENSES.zip" LICENSES)
          cp "$XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_client_android/alvr_client_android.apk" "out/Quest3-Pyrowave-$Q3PW_SIGNING_KIND.apk"
          cp "$XRWIRED_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" out/
          cp tools/pyrowave_android/pyrowave_android tools/udptest/udprecv-android tools/pyroclient/pyroclient_test tools/pyroclient/libpyroclient.so "$XRWIRED_INPUTS/research/pyrowave/build-android/libpyrowave-shared.so" out/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/Quest3-Pyrowave-$Q3PW_SIGNING_KIND.apk" > out/APK-CERTIFICATE.txt
          python3 tools/ci/build_metadata.py write --platform android --output out --pyrowave "$XRWIRED_INPUTS/research/pyrowave" --certificate-file out/APK-CERTIFICATE.txt --require-signing-certificate --signing-kind "$Q3PW_SIGNING_KIND" --required-native out/libpyrowave-shared.so out/libpyroclient.so
          (cd out && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Quest3-Pyrowave-Android
          path: out/
      - name: Save reusable Android compilation after success or test failure
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.cargo_client_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
            ws/research/ALVR-20.13.0/target/aarch64-linux-android/release
          key: ${{ steps.cargo_client_cache.outputs.cache-primary-key }}
  streamer:
    runs-on: windows-2022
    needs: tests
    if: ${{ !inputs.cpu_only && always() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Load authoritative build pins
        shell: bash
        run: python3 tools/ci/source_lock.py --github-env >> "$GITHUB_ENV"
      - name: Reconstruct pinned sources
        shell: bash
        run: sh tools/ci/fetch_sources.sh "$XRWIRED_INPUTS/research"
      - name: Windows owned-process handle regression (CPU only)
        run: python -m unittest tools.tests.test_unattended_windows -v
      - name: Experimental composition shader hashes and software WARP pixels
        shell: cmd
        run: call tools\windows\check_quality_shaders.cmd || exit /b 1
      - name: Stamp the installable client/server identity
        shell: bash
        run: python3 tools/ci/stamp_alvr_version.py "$XRWIRED_INPUTS/research/ALVR-20.13.0"
      - name: Cache Rust dependencies and compiled Windows targets
        id: cargo_streamer_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
          key: q3pw-streamer-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ github.sha }}
          restore-keys: |
            q3pw-streamer-v1-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
      - name: Check Windows process isolation before native builds
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = $env:RUST_TOOLCHAIN
          Set-Location "$env:XRWIRED_INPUTS/research/ALVR-20.13.0"
          cargo test --release -p alvr_adb --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PyroWave and ALVR streamer
        shell: cmd
        run: |
          call tools\windows\build_pyrowave_pc.cmd interop pc || exit /b 1
          call tools\windows\build_streamer.cmd || exit /b 1
      - name: Build isolated frame-bank HVS scorer
        shell: pwsh
        run: |
          python -m tools.xrbench.hvs_scorer prepare-source --source "$env:XRWIRED_INPUTS/research/pyrowave" --out "$env:XRWIRED_INPUTS/research/pyrowave-hvs-scorer" --manifest-out "$env:XRWIRED_INPUTS/research/pyrowave-hvs-scorer-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /c tools\windows\build_pyrowave_hvs_scorer.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Q3PW_HVS_SCORER_TEST_EXE = "$env:XRWIRED_INPUTS/research/pyrowave-hvs-scorer/build-hvs-scorer/Release/pyrowave-framebank-hvs.exe"
          python -m unittest tools.tests.test_xrbench_hvs_binary -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Frame assembly and preset regression tests
        shell: pwsh
        run: |
          $env:RUSTUP_TOOLCHAIN = $env:RUST_TOOLCHAIN
          Set-Location "$env:XRWIRED_INPUTS/research/ALVR-20.13.0"
          cargo test --release -p alvr_client_core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_client_openxr --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_common --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_session --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_packets --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_server_core --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_server_io --lib initialization_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release -p alvr_dashboard --bin alvr_dashboard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $source = "$env:XRWIRED_INPUTS/research/pyrowave-hvs-scorer"
          $scorer = "$source/build-hvs-scorer/Release/pyrowave-framebank-hvs.exe"
          $codecSource = "$env:XRWIRED_INPUTS/research/pyrowave"
          $encode = "$codecSource/build-pc/Release/pyrowave-encode.exe"
          $decode = "$codecSource/build-pc/Release/pyrowave-decode.exe"
          @($scorer,$encode,$decode,"$source/PYROWAVE-HVS-PPD-SCORER.json","$source/shaders/psnr_hvs_m.comp","$codecSource/LICENSE") | ForEach-Object { if (!(Test-Path $_)) { throw "frame-bank tool provenance is missing: $_" } }
          Copy-Item $scorer out/pyrowave-psnr-hvs-m.exe
          Copy-Item $encode out/pyrowave-encode.exe
          Copy-Item $decode out/pyrowave-decode.exe
          Copy-Item "$source/PYROWAVE-HVS-PPD-SCORER.json" out/HVS-SCORER-SOURCE.json
          Copy-Item "$codecSource/LICENSE" out/PYROWAVE-LICENSE.txt
          Copy-Item "$source/shaders/psnr_hvs_m.comp" out/psnr_hvs_m.comp
          $dumpbin = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio/2022/*/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dumpbin) { throw 'PE dependency inspection tool missing' }
          $imports = @{}
          foreach ($exe in Get-ChildItem out/*.exe) {
            $dump = (& $dumpbin.FullName /dependents $exe.FullName) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw 'offline PE dependency inspection failed' }
            $names = [regex]::Matches($dump, '(?im)^\s+([A-Za-z0-9_.+-]+\.dll)\s*$') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            if (!$names) { throw 'offline executable has no verified import list' }
            $rows = foreach ($name in $names) {
              if ($name -match '^(api-ms-win-|ext-ms-win-)') { @{ name=$name; provider='api_set' } }
              elseif (Test-Path "out/$name") { @{ name=$name; provider='bundle'; sha256=(Get-FileHash "out/$name").Hash.ToLower() } }
              elseif (Test-Path "$env:WINDIR/System32/$name") { @{ name=$name; provider='windows_system' } }
              else { throw "missing offline dependency: $name" }
            }
            $imports[$exe.Name] = @($rows)
          }
          @{ schema=1; kind='framebank_windows_imports'; tools=$imports } | ConvertTo-Json -Depth 5 | Set-Content out/FRAMEBANK-IMPORTS.json
          $lockHash = python -c "import sys; from pathlib import Path; sys.path.insert(0,'tools/ci'); from build_metadata import source_lock_sha256; print(source_lock_sha256(Path('sources.lock.json')))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = @{ schema = 1; kind = 'pyrowave_framebank_tools_build'; source_lock_sha256 = $lockHash.Trim(); source_psnr_cpp_sha256 = (Get-FileHash "$source/psnr.cpp").Hash.ToLower(); source_manifest_sha256 = (Get-FileHash "$source/PYROWAVE-HVS-PPD-SCORER.json").Hash.ToLower(); imports_manifest_sha256=(Get-FileHash out/FRAMEBANK-IMPORTS.json).Hash.ToLower(); tools = @{ scorer_sha256 = (Get-FileHash $scorer).Hash.ToLower(); encode_sha256 = (Get-FileHash $encode).Hash.ToLower(); decode_sha256 = (Get-FileHash $decode).Hash.ToLower() } } | ConvertTo-Json -Depth 3
          Set-Content out/FRAMEBANK-TOOLS-BUILD-METADATA.json $meta
          python tools/ci/package_licenses.py "$env:XRWIRED_INPUTS/research" "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/LICENSES"
          Compress-Archive "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/LICENSES/*" out/FRAMEBANK-LICENSES.zip
          Copy-Item tools/windows/quality-shaders.json out/WINDOWS-COMPOSITION-SHADERS.json
          Copy-Item tools/windows/quality-shaders.json "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/WINDOWS-COMPOSITION-SHADERS.json"
          Compress-Archive "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/*" out/Quest3-Pyrowave-Windows.zip
          python tools/ci/build_metadata.py write --platform windows --output out --pyrowave "$env:XRWIRED_INPUTS/research/pyrowave" --required-native "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/bin/win64/driver_alvr_server.dll" "$env:XRWIRED_INPUTS/research/ALVR-20.13.0/build/alvr_streamer_windows/bin/win64/libpyrowave-shared-0.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check -r tools/quest3/requirements-cpu.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.xrbench.framebank verify-tools --tools-metadata out/FRAMEBANK-TOOLS-BUILD-METADATA.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash out/Quest3-Pyrowave-Windows.zip).Hash.ToLower() + '  Quest3-Pyrowave-Windows.zip' | Set-Content out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Quest3-Pyrowave-Windows
          path: out/
      - name: Save reusable Windows compilation after success or test failure
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.cargo_streamer_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ws/research/ALVR-20.13.0/target/release
            ws/research/ALVR-20.13.0/target/debug
          key: ${{ steps.cargo_streamer_cache.outputs.cache-primary-key }}
  matching-pair:
    runs-on: ubuntu-24.04
    needs: [client, streamer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Quest3-Pyrowave-Android
          path: android
      - uses: actions/download-artifact@v4
        with:
          name: Quest3-Pyrowave-Windows
          path: windows
      - name: Reject mismatched build identities
        run: python3 tools/ci/build_metadata.py verify-pair android/BUILD-METADATA.json windows/BUILD-METADATA.json
