name: Position-aware RDO offline tools

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  XRWIRED_INPUTS: ${{ github.workspace }}/ws

jobs:
  offline-pyrowave:
    runs-on: windows-2022
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Load locked inputs
        shell: bash
        run: python3 tools/ci/source_lock.py --github-env >> "$GITHUB_ENV"
      - name: Reconstruct locked PyroWave source
        shell: bash
        run: sh tools/ci/fetch_sources.sh "$XRWIRED_INPUTS/research"
      - name: Build offline shader tool and regenerate the embedded shader
        shell: cmd
        run: |
          call tools\windows\build_pyrowave_pc.cmd tools || exit /b 1
          ws\research\pyrowave\build-tools\Release\slangmosh.exe ws\research\pyrowave\shaders\slangmosh.json --namespace PyroWave --output ws\research\pyrowave\shaders\slangmosh.hpp -O --strip || exit /b 1
          python tools\ci\check_shader_manifest.py ws\research\pyrowave --write || exit /b 1
      - name: Build offline encoder and CPU RDO tests
        shell: cmd
        run: call tools\windows\build_pyrowave_pc.cmd pc rdo-test || exit /b 1
      - name: Package offline tool evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$env:XRWIRED_INPUTS/research/pyrowave/shaders/slangmosh.hpp" out/
          Copy-Item "$env:XRWIRED_INPUTS/research/pyrowave/shaders/quest3-manifest.json" out/
          Copy-Item "$env:XRWIRED_INPUTS/research/pyrowave/build-pc/Release/pyrowave-encode.exe" out/
          Copy-Item "$env:XRWIRED_INPUTS/research/pyrowave/build-pc/Release/pyrowave-decode.exe" out/
          Copy-Item "$env:XRWIRED_INPUTS/research/pyrowave/build-pc/Release/pyrowave-rdo-density-test.exe" out/
          python tools/ci/build_metadata.py write --platform windows --output out --pyrowave "$env:XRWIRED_INPUTS/research/pyrowave" --required-native out/pyrowave-encode.exe out/pyrowave-decode.exe out/pyrowave-rdo-density-test.exe
          Get-FileHash out/* -Algorithm SHA256 | Format-Table -AutoSize | Out-File -Encoding ascii out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: position-rdo-offline-tools
          path: out/
